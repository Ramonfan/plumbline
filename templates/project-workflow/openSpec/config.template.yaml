schema: spec-driven

context: |
  Language: {{DOCUMENT_LANGUAGE}}
  All artifacts must be written in {{DOCUMENT_LANGUAGE}}.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: {{PROJECT_NAME}}，工作区为 {{WORKSPACE_ROOT}}。
  Agent entry: Codex 和通用 agent 读取根目录 AGENTS.md；Claude Code 读取根目录 CLAUDE.md，并由它导入 AGENTS.md 和 PROJECT_PROFILE.md，不维护第二份规则。
  Project profile: 根目录 PROJECT_PROFILE.md 是项目边界、技术栈、命令和验收方式的权威入口。
  OpenSpec 是需求、行为规格、技术设计、任务进度、验收证据和归档的唯一事实源。
  Superpowers 只提供测试驱动开发、系统化调试、代码审查和完成前验证。
  执行者负责维护 OpenSpec、按风险调用 Superpowers、执行实现与验证并回写结果。
  任务开始前必须确认实际 Git 仓库边界，不得覆盖或回退无关未提交改动。
  验证必须使用 PROJECT_PROFILE.md 中定义的真实命令、环境和人工验收矩阵。
  按风险匹配流程深度；L1 精简工件和审查，复杂任务保留完整设计、审查与验证。
  Token 优化优先减少重复上下文、重复文档和重复验证，不默认降低复杂任务推理强度。

rules:
  proposal:
    - 明确任务等级：L1 小型修复、L2 常规需求或 L3 核心改造；L0 阅读分析不创建 change。
    - 必须包含目标、非目标、影响范围、验收口径和需求门禁结论。
    - 需求未确认时不得进入实现；只读任务转实现时必须新建或关联 change。
  specs:
    - 只描述可观察、可验证的行为契约，不写逐步实现细节。
    - 每条 Requirement 必须包含正常场景，并按风险覆盖失败、兼容、重复进入、安全或生命周期场景。
    - 涉及接口、数据、权限、存储、消息、UI 或跨模块回显时必须覆盖对应边界。
  design:
    - design 按 CLI 条件和风险决定是否生成；若为必需依赖则提供最小有效设计，不绕过 blocked。
    - 描述相关链路、职责、数据流、时序、关键假设、更简替代方案、兼容、迁移、风险、回滚和验证方式。
    - 必须列出影响入口、调用方、被调用方、数据契约和实际仓库边界。
    - 方案门禁未通过时不得创建可执行实施任务。
  tasks:
    - 每个任务必须是可独立验证的最小交付单元，写成可验证目标，并在描述中写明验证方式。
    - 原因未知的缺陷先系统化调试；新增专项单测或完整 TDD 按方案门禁结论执行。
    - 必须包含匹配风险的审查、最窄有效验证和相关仓库状态检查。
    - 自动验证完成但用户未验收时，交付任务保持未完成，不得归档。

operations:
  apply:
    guidance:
      - 开始实现前确认用户已通过方案门禁并明确允许落地。
      - 只修改当前 change 范围内文件，不覆盖、回退或整理无关改动。
      - 每完成一项任务立即回写 checkbox 和必要证据；同一结果只记录一次，其余引用。
      - 已有证据覆盖当前源码和依赖版本且无新变化或疑点时可以复用；相关变化后重新验证。
      - 编译、构建、迁移或部署错误修复后必须执行对应真实验证。
      - L0/L1 使用最小上下文包，仅在实际触及某领域时读取对应长期主规格。
      - 复杂实现、疑难缺陷、安全权限、公共契约和构建错误修复不得为节省成本默认降级推理深度。
  archive:
    guidance:
      - 归档前必须完成代码审查、完成前验证和用户交付门禁。
      - 归档摘要记录影响仓库、提交或补丁、验证命令、人工验收、残留风险和后续事项。
      - 规格同步完成后再归档，不得把待验收或部分完成的 change 标记为交付完成。
